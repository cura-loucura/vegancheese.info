<link rel="stylesheet" href="/assets/style.css">
<script>
/* GitHub Pages cannot serve real 3xx redirects, so the old GoDaddy URLs are
   forwarded here instead. Runs before render to avoid a visible flash. */
(function () {
  var old = {
    "/impressum-/-kontakt": "/impressum.html",
    "/impressum-%2f-kontakt": "/impressum.html",
    "/impressum": "/impressum.html",
    "/kontakt": "/impressum.html",
    "/datenschutzerklärung": "/datenschutz.html",
    "/datenschutzerklaerung": "/datenschutz.html",
    "/datenschutz": "/datenschutz.html"
  };
  var raw = location.pathname.replace(/\/+$/, "").toLowerCase();
  var dec = raw;
  try { dec = decodeURIComponent(raw); } catch (e) {}
  var to = old[dec] || old[raw];
  if (to) location.replace(to + location.search + location.hash);
})();
</script>
</head>

    </a>
